services:
  - type: web
    name: genbank
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./MiniBankingSystem/Dockerfile
    dockerContext: ./MiniBankingSystem
    healthCheckPath: /
    disk:
      name: genbank-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GENBANK_DB_URL
        value: "jdbc:h2:file:/var/data/banking_data;MODE=MySQL;DB_CLOSE_DELAY=-1"
